# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest flit codespell
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Check spelling errors in the code and documentation
      run: |
        codespell

  # Builds every RPC adapter class against the real Time Tagger library.
  # This exercises the whole introspection path in server.py and needs no
  # hardware, because adapter generation only reads the class definitions.
  adapters:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install package with the Time Tagger library
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[server]'
    - name: Report library version
      run: |
        python -c "from Swabian import TimeTagger; print('Time Tagger', TimeTagger.getVersion())"
    - name: Generate all RPC adapters
      run: |
        python -c "
        import logging
        logging.basicConfig(level=logging.DEBUG)
        from TimeTaggerRPC import server
        server.check_timetagger_version()
        rpc = server.make_timetagger_library_adapter()
        names = sorted(n for n in dir(rpc) if not n.startswith('_'))
        print('Exposed members:', len(names))
        for n in names:
            print(' -', n)
        enums = rpc._enums
        print('Exposed enums:', sorted(enums))
        assert 'createTimeTagger' in names, 'createTimeTagger must be exposed'
        assert 'Correlation' in names, 'Correlation must be exposed'
        assert 'freeTimeTagger' in names
        # Time Tagger facets without a create*() factory must not be exposed.
        for n in ('createTimeTaggerSource', 'createTimeTaggerHardware', 'createTimeTaggerServer'):
            assert n not in names, n + ' must not be exposed'
        "
